# ===== U2 =====
# Preferred: CookieCloud
cookiecloud.url=https://cocl.bigq.top:10100
cookiecloud.key=replace-with-your-cookiecloud-key
cookiecloud.password=replace-with-your-cookiecloud-password

# Optional fallback: raw browser Cookie header
cookie=

# Optional legacy fallback: cookies.txt or one-line cookie file
cookie_file=

# Required: your U2 passkey
passkey=replace-with-your-u2-passkey

# ===== QB =====
qb.url=http://127.0.0.1:18080
qb.user=admin
qb.pass=adminadmin

# ===== QB Torrent Settings =====
qb.category=pt-u2

# Upload speed limit in MB/s
# 0 = unlimited
qb.up_limit_mb=50

# Max currently-downloading torrents
# Keep this small to avoid piling up too many active downloads
qb.max_downloading=3

# Re-add cooldown in minutes after a successful import
# Default is 24 hours to prevent duplicate downloads within one day
seed.readd_cooldown_minutes=1440

# Ignore shout messages older than this many minutes
# 0 = disabled
shout.max_age_minutes=120

# Minimum safe free space in GB before adding new torrents
# This is checked both before add and after estimating torrent size
qb.min_free_space_gb=20

# Allowed upload magic rates, comma-separated
magic.up_rates=1.00,2.00,2.33

# When enabled, any magic with upload >= min and download <= max is accepted
magic.use_thresholds=0
magic.min_up_rate=1.00
magic.max_down_rate=0.00

# Dynamic rule 1
dynamic.rule1.enabled=0
dynamic.rule1.free_space_le_gb=0
dynamic.rule1.min_size_gb=0
dynamic.rule1.max_size_gb=0
dynamic.rule1.min_up_rate=0
dynamic.rule1.max_down_rate=999

# Dynamic rule 2
dynamic.rule2.enabled=0
dynamic.rule2.free_space_le_gb=0
dynamic.rule2.min_size_gb=0
dynamic.rule2.max_size_gb=0
dynamic.rule2.min_up_rate=0
dynamic.rule2.max_down_rate=999

# Proactively refresh qB session before it gets too old
# 0 = disabled
qb.session_refresh_seconds=1500

# ===== Web UI =====
web.host=0.0.0.0
web.port=18081
web.username=admin
web.password=change-this-web-password
web.session_hours=12
web.qb_refresh_seconds=5
log.archive_interval_minutes=60
log.archive_keep_count=20

# Legacy fallback, only used when web.password is empty
web.token=

# ===== Telegram =====
telegram.bot_token=
telegram.chat_id=
telegram.poll_seconds=3

# Poll interval in seconds
poll_interval=60
